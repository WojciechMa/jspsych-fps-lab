name: Deploy study to JATOS

# Manual only: Actions > Deploy study to JATOS > Run workflow, then pick the study and the target.
# Builds the study's JZIP and imports it through the JATOS API. The import overwrites the study
# with the same UUID (properties and assets) and keeps its results. Each target is a GitHub
# environment holding the secrets JATOS_URL (e.g. https://jatos.example.org) and JATOS_TOKEN (API
# token of a dedicated JATOS user who is a member of the study); give it required reviewers.
# A study with a custom face also needs the secret FACE_<ID> (npm run build:face prints it). The
# face goes into the JZIP only in the deploy job, so the uploaded artifact never contains it.

on:
  workflow_dispatch:
    inputs:
      study:
        description: Study id (public/studies/<id>.json with save.target "jatos")
        required: true
        type: string
      target:
        description: GitHub environment of the JATOS server
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: jatos-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      jzip: ${{ steps.pack.outputs.jzip }}
      dir: ${{ steps.pack.outputs.dir }}
      face: ${{ steps.pack.outputs.face }}
      face_secret: ${{ steps.pack.outputs.face_secret }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:engine
        env:
          CONTAINER_ENGINE: docker
      - uses: ./.github/actions/add-freedoom
      - id: pack
        env:
          STUDY: ${{ inputs.study }}
        run: |
          [[ "$STUDY" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid study id: $STUDY"; exit 1; }
          npm run build:jatos -- "$STUDY" --no-face
          files=(dist-jatos/*.jzip)
          [[ ${#files[@]} -eq 1 ]] || { echo "Expected one .jzip, found ${#files[@]}"; exit 1; }
          echo "jzip=$(basename "${files[0]}")" >> "$GITHUB_OUTPUT"
          echo "dir=jspsych-fps-lab-$STUDY" >> "$GITHUB_OUTPUT"
          face=$(jq -r '.face // "freedoom"' "public/studies/$STUDY.json")
          [[ "$face" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid face id: $face"; exit 1; }
          echo "face=$face" >> "$GITHUB_OUTPUT"
          secret="FACE_${face^^}"
          echo "face_secret=${secret//-/_}" >> "$GITHUB_OUTPUT"
      # Also kept for a manual import (Studies > + > Import study); without a custom face.
      - uses: actions/upload-artifact@v7
        with:
          name: jzip
          path: dist-jatos/*.jzip
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jzip
      - name: Add the face
        if: needs.build.outputs.face != 'freedoom'
        env:
          FACE: ${{ needs.build.outputs.face }}
          FACE_SECRET: ${{ needs.build.outputs.face_secret }}
          FACE_WAD: ${{ secrets[needs.build.outputs.face_secret] }}
          DIR: ${{ needs.build.outputs.dir }}
          JZIP: ${{ needs.build.outputs.jzip }}
        run: |
          [[ -n "$FACE_WAD" ]] || { echo "Secret $FACE_SECRET is missing in this environment (see npm run build:face)"; exit 1; }
          mkdir -p "$DIR/wads"
          base64 -d <<< "$FACE_WAD" | gunzip > "$DIR/wads/face-$FACE.wad"
          [[ "$(head -c 4 "$DIR/wads/face-$FACE.wad")" == PWAD ]] || { echo "Secret $FACE_SECRET is not a gzipped, base64-encoded PWAD"; exit 1; }
          zip -q -X "$JZIP" "$DIR/wads/face-$FACE.wad"
          rm -r "$DIR"
      - name: Import into JATOS
        env:
          JATOS_URL: ${{ secrets.JATOS_URL }}
          JATOS_TOKEN: ${{ secrets.JATOS_TOKEN }}
          JZIP: ${{ needs.build.outputs.jzip }}
        run: |
          [[ -n "$JATOS_TOKEN" ]] || { echo "Secret JATOS_TOKEN is missing in this environment"; exit 1; }
          [[ "$JATOS_URL" =~ ^https://[^/[:space:]]+(/[^[:space:]]*)?$ ]] || { echo "Secret JATOS_URL must be an https:// URL"; exit 1; }
          curl --fail-with-body -sS -o response.json -X POST "${JATOS_URL%/}/jatos/api/v1/studies" \
            -H "Authorization: Bearer $JATOS_TOKEN" \
            -F "study=@$JZIP" || { cat response.json 2>/dev/null; exit 1; }
          jq -r '.data | "Imported study \(.id) \"\(.title)\" (\(.uuid)) into \(.dirName)"' response.json
