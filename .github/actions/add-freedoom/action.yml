name: Add Freedoom
description: Fetches the Freedoom release pinned in src/paradigms/iwad.json and builds the trimmed IWAD from it into public/wads, with Freedoom's licence files.

runs:
  using: composite
  steps:
    # freedoom2.wad itself stays out of the build (vite.config.ts DEV_ONLY_WADS).
    - shell: bash
      run: |
        npm run fetch:freedoom
        npm run build:iwad
